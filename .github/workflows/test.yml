# Kiểm thử tự động ở mỗi pull request và mỗi lần code vào main.
# - App: kiểm kiểu, unit test, build, rồi E2E ở chế độ thử.
# - Database: dựng database trống từ supabase/migrations + seed, chạy tests/db, rồi làm hỏng từng luật để chắc test bắt được.
#   Không chạm database thật, không cần secret.
# - E2E chạy ở workflow riêng (e2e.yml), trên bản preview Vercel.
name: Kiểm thử

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm kiểu
        run: npm run typecheck --if-present
      - name: Unit test
        run: npm test --if-present
      - name: Build
        run: npm run build
      - name: E2E chế độ thử (app chạy bằng dữ liệu mẫu, không cần Supabase)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c tests/e2e/playwright.config.ts --project=android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-che-do-thu
          path: tests/e2e/test-results/
          retention-days: 7

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Dựng database từ migration và chạy kiểm thử
        run: bash scripts/test-db.sh
      - name: Danh sách bảng và cột trong repo phải khớp migration
        run: |
          bash scripts/bang-cot.sh
          git diff --exit-code docs/tu-sinh/ || { echo "::error::docs/tu-sinh/Bang_va_cot.md cũ so với migration. Chạy scripts/test-db.sh rồi scripts/bang-cot.sh và commit file vừa sinh."; exit 1; }
      - name: Mỗi tiêu chí nghiệm thu thuộc đúng một story, mọi mã được trỏ tới đều tồn tại
        run: python3 scripts/kiem-tai-lieu.py
      - name: Thử làm hỏng từng luật, test phải báo đỏ
        run: bash scripts/thu-lam-hong.sh
