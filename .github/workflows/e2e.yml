# E2E trên bản preview Vercel của mỗi PR. Vercel báo "deployment_status: success" kèm địa chỉ preview, workflow chạy Playwright vào địa chỉ đó.
# Preview trỏ vào Supabase STAGING (biến môi trường Preview trên Vercel). Tài khoản thử ở GitHub Secrets, chỉ có trên staging.
# Chỉ chạy khi repo đã có package.json và tests/e2e.
name: E2E

on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.target_url }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_CHU_EMAIL: ${{ secrets.E2E_CHU_EMAIL }}
      E2E_CHU_MAT_KHAU: ${{ secrets.E2E_CHU_MAT_KHAU }}
      E2E_SALE_EMAIL: ${{ secrets.E2E_SALE_EMAIL }}
      E2E_SALE_MAT_KHAU: ${{ secrets.E2E_SALE_MAT_KHAU }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Bỏ qua nếu chưa có app
        id: co_app
        run: |
          if [ -f package.json ] && ls tests/e2e/*.spec.ts >/dev/null 2>&1; then echo "co=1" >> "$GITHUB_OUTPUT"; else echo "Chưa có app hoặc chưa có spec, bỏ qua."; fi
      - uses: actions/setup-node@v4
        if: steps.co_app.outputs.co == '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.co_app.outputs.co == '1'
        run: npm ci && npx playwright install --with-deps chromium webkit
      - name: Chạy Playwright trên preview
        if: steps.co_app.outputs.co == '1'
        run: npx playwright test -c tests/e2e
      - uses: actions/upload-artifact@v4
        if: always() && steps.co_app.outputs.co == '1'
        with:
          name: e2e-anh-chup
          path: |
            test-results/
            playwright-report/
          retention-days: 14
