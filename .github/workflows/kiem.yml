# CI của Home247 bản PWA (QD21).
# Hiện chỉ có job kiem: kiểm tài liệu và test của scripts. Hook trước gộp (scripts/hook/truoc-gop.sh)
# cần ít nhất một lượt CI xanh, kể cả PR chỉ sửa tài liệu.
# EN dựng nền thêm job app (typecheck, unit, build) và database (migration, tests/db) khi có code.
name: kiem

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kiem-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kiem:
    name: kiem.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - name: Chặn lỗi trên file đổi (luật [MỞ] chỉ áp cho dòng mới)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD~1"
          fi
          python3 scripts/kiem.py --chan --diff "$BASE"
      - name: Cả repo, chỉ cảnh báo
        run: python3 scripts/kiem.py --tom-tat
      - name: Test của scripts
        run: python3 -m unittest discover -s scripts/tests -v

  # EN1: app (typecheck, test unit, build, e2e trên bản build). Lệnh: docs/dev/chay-va-test.md.
  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Giữ báo cáo e2e khi đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # EN2: dựng database từ migration trên Postgres 16 trần, chạy test database, thử làm hỏng, kiểm bảng cột đã sinh lại.
  database:
    name: database
    runs-on: ubuntu-latest
    # Thử làm hỏng chạy lại cả bộ test cho mỗi phép thử nên tăng theo số phép thử (PR #43 hết 13,5 phút, PR #44 quá 15 phút).
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cài psql (bản client của máy chạy CI, nói chuyện được với server 16)
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version
      - name: Test database (scripts/test-db.sh)
        run: scripts/test-db.sh
      - name: Thử làm hỏng (scripts/thu-lam-hong.sh)
        run: scripts/thu-lam-hong.sh
      - name: Thử sao lưu và khôi phục (scripts/thu-sao-luu.sh, EN6)
        run: scripts/thu-sao-luu.sh
      - name: Bảng cột đã sinh lại sau khi đổi migration (scripts/bang-cot.sh)
        run: |
          scripts/bang-cot.sh
          git diff --exit-code supabase/bang-va-cot.md || { echo "Chạy scripts/bang-cot.sh rồi commit supabase/bang-va-cot.md"; exit 1; }

  # US2: e2e luồng đăng ký, đăng nhập trên Supabase chạy ở máy CI (Docker) với hộp thư giả Mailpit.
  # Khóa anon lấy từ `supabase status` là khóa mẫu công khai của Supabase CLI, không phải khóa của project nào.
  e2e-supabase:
    name: e2e-supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bật Supabase (migration trong supabase/migrations chạy lúc bật)
        run: npx -y supabase@2.122.1 start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      - name: Đặt URL, khóa anon, địa chỉ database cho build và test
        run: |
          npx -y supabase@2.122.1 status -o env > "$RUNNER_TEMP/sb.env"
          lay() { grep "^$1=" "$RUNNER_TEMP/sb.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          {
            echo "VITE_SUPABASE_URL=$(lay API_URL)"
            echo "VITE_SUPABASE_ANON_KEY=$(lay ANON_KEY)"
            echo "E2E_DB_URL=$(lay DB_URL)"
            echo "E2E_MAILPIT_URL=$(lay MAILPIT_URL)"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/sb.env"
      - name: Cài psql (test đọc hồ sơ trong database)
        run: command -v psql || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E trên Supabase (tests/e2e/supabase)
        env:
          E2E_SUPABASE: '1'
        run: npx playwright test tests/e2e/supabase
      - name: Giữ báo cáo e2e khi đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-supabase
          path: playwright-report
          retention-days: 7
      - name: Tắt Supabase
        if: always()
        run: npx -y supabase@2.122.1 stop --no-backup
