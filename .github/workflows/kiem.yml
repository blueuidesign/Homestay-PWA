# CI của Home247 bản PWA (QD21).
# Hiện chỉ có job kiem: kiểm tài liệu và test của scripts. Hook trước gộp (scripts/hook/truoc-gop.sh)
# cần ít nhất một lượt CI xanh, kể cả PR chỉ sửa tài liệu.
# EN dựng nền thêm job app (typecheck, unit, build) và database (migration, tests/db) khi có code.
name: kiem

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kiem-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kiem:
    name: kiem.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - name: Chặn lỗi trên file đổi (luật [MỞ] chỉ áp cho dòng mới)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD~1"
          fi
          python3 scripts/kiem.py --chan --diff "$BASE"
      - name: Cả repo, chỉ cảnh báo
        run: python3 scripts/kiem.py --tom-tat
      - name: Test của scripts
        run: python3 -m unittest discover -s scripts/tests -v

  # EN2: dựng database từ migration trên Postgres 16 trần, chạy test database, thử làm hỏng, kiểm bảng cột đã sinh lại.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cài psql (bản client của máy chạy CI, nói chuyện được với server 16)
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version
      - name: Test database (scripts/test-db.sh)
        run: scripts/test-db.sh
      - name: Thử làm hỏng (scripts/thu-lam-hong.sh)
        run: scripts/thu-lam-hong.sh
      - name: Bảng cột đã sinh lại sau khi đổi migration (scripts/bang-cot.sh)
        run: |
          scripts/bang-cot.sh
          git diff --exit-code supabase/bang-va-cot.md || { echo "Chạy scripts/bang-cot.sh rồi commit supabase/bang-va-cot.md"; exit 1; }
